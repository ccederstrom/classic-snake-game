<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Classic Snake</h1>
      <section class="hud" aria-label="Game status">
        <p>Score: <strong id="score">0</strong></p>
        <p>High score: <strong id="high-score">0</strong></p>
        <p id="status">Press any arrow key or WASD to start</p>
      </section>

      <div id="board" class="board" role="grid" aria-label="Snake board"></div>

      <section class="controls" aria-label="Game controls">
        <button type="button" data-dir="up" aria-label="Move up">↑</button>
        <div>
          <button type="button" data-dir="left" aria-label="Move left">←</button>
          <button type="button" data-dir="down" aria-label="Move down">↓</button>
          <button type="button" data-dir="right" aria-label="Move right">→</button>
        </div>
        <button type="button" id="pause-btn">Pause</button>
        <button type="button" id="restart-btn">Restart</button>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
